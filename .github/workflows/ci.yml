name: CI

# Converted from the former builds.sr.ht manifest (.build.yml).
# Each sourcehut task is one step; $HOME is the workspace, as on sourcehut.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: debian:stable
    env:
      DEBIAN_FRONTEND: noninteractive
    defaults:
      run:
        shell: bash -xe {0}
    steps:
      - name: Install packages
        run: |
          apt-get update
          apt-get install -y git ca-certificates \
            build-essential \
            python3 \
            python3-pip \
            python3-venv \
            libnsl-dev \
            ca-certificates

      - uses: actions/checkout@v4
        with:
          path: "music-player"
          submodules: recursive
          fetch-depth: 0

      - name: "build"
        run: |
          export HOME="$GITHUB_WORKSPACE"
          cd "$HOME"
          cd "$HOME/music-player"
          export PATH="$HOME/.local/bin:$PATH"
          export CONAN_HOME="$HOME/.conan2"
          python3 -m pip install --break-system-packages --user --no-cache-dir "conan>=2,<3" "cmake>=3.30"
          conan profile detect --force
          conan install . --build=missing
          cmake --preset conan-release
          cmake --build --preset conan-release --parallel

      - uses: actions/upload-artifact@v4
        with:
          name: artifacts
          if-no-files-found: warn
          path: |
            music-player/build/Release/main/music_player
